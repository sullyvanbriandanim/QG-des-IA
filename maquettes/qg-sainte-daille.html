<title>QG Sainte-Daille</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout : open space isométrique plein écran (tablette d'abord) + fiche qui s'ouvre à droite (feuille du bas sur téléphone). */
:root{
  --bg:#edf2ee; --surface:#ffffff; --surface-2:#f3f7f4; --fg:#1b2924; --muted:#5a6c65; --line:#d3ddd8;
  --accent:#1f7a5c; --accent-fg:#ffffff; --gold:#c98f12;
  --ok:#2a8f55; --warn:#c27c06; --bad:#c2453a; --info:#3a6fd0;
  --c-dir:#2d3f6b; --c-anim:#e5703a; --c-plan:#17918b; --c-com:#3a70d4; --c-cm:#cf4b87; --c-suivi:#66944a; --c-free:#93a29c; --c-new:#8a5cd0;
  --sky:#bfe2f1; --wall:#f4ede1; --wall-side:#e7dccb; --wall-top:#cbbda5;
  --floor-pres:#e6cd9f; --floor-dg:#dcd4c4; --floor-open:#e3e8e3; --floor-pause:#cde6d6;
  --desk:#f8f4eb; --desk-pres:#a8703e; --shelf:#b98250; --monitor:#2a323f; --screen:#8fd6ff;
  --chair:#55606d; --plant:#3c9a59; --plant-2:#2e7d46; --pot:#c4693c; --sofa:#ef8a5b; --counter:#e9e1d2;
  --glass:#a6d6ea; --bubble:#ffffff; --bubble-fg:#1b2924; --tag:#ffffff;
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111a17; --surface:#18231f; --surface-2:#1f2b27; --fg:#e6eee9; --muted:#9bb0a7; --line:#2b3a35;
  --accent:#4cc08f; --accent-fg:#0d1a15; --gold:#f0b73a;
  --ok:#57c784; --warn:#e8a93a; --bad:#ef7468; --info:#78a3f0;
  --c-dir:#7f95d1; --c-anim:#f08b57; --c-plan:#3fb8b1; --c-com:#6c98ec; --c-cm:#e47aa9; --c-suivi:#8ebb70; --c-free:#7b8a85; --c-new:#a988e0;
  --sky:#2b4170; --wall:#3a3f46; --wall-side:#32373e; --wall-top:#272b31;
  --floor-pres:#5b4a33; --floor-dg:#47433c; --floor-open:#353e3b; --floor-pause:#2c4638;
  --desk:#5e636b; --desk-pres:#6e4826; --shelf:#7a5333; --monitor:#13171d; --screen:#6fe2ff;
  --chair:#2c333b; --plant:#2f7d48; --plant-2:#246338; --pot:#8d4b2c; --sofa:#b65f3c; --counter:#4b4f55;
  --glass:#6aa5bf; --bubble:#24312c; --bubble-fg:#e6eee9; --tag:#24312c; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111a17; --surface:#18231f; --surface-2:#1f2b27; --fg:#e6eee9; --muted:#9bb0a7; --line:#2b3a35;
  --accent:#4cc08f; --accent-fg:#0d1a15; --gold:#f0b73a;
  --ok:#57c784; --warn:#e8a93a; --bad:#ef7468; --info:#78a3f0;
  --c-dir:#7f95d1; --c-anim:#f08b57; --c-plan:#3fb8b1; --c-com:#6c98ec; --c-cm:#e47aa9; --c-suivi:#8ebb70; --c-free:#7b8a85; --c-new:#a988e0;
  --sky:#2b4170; --wall:#3a3f46; --wall-side:#32373e; --wall-top:#272b31;
  --floor-pres:#5b4a33; --floor-dg:#47433c; --floor-open:#353e3b; --floor-pause:#2c4638;
  --desk:#5e636b; --desk-pres:#6e4826; --shelf:#7a5333; --monitor:#13171d; --screen:#6fe2ff;
  --chair:#2c333b; --plant:#2f7d48; --plant-2:#246338; --pot:#8d4b2c; --sofa:#b65f3c; --counter:#4b4f55;
  --glass:#6aa5bf; --bubble:#24312c; --bubble-fg:#e6eee9; --tag:#24312c; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;overflow:hidden}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;flex-direction:column;gap:1px;margin-right:auto;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;margin:0;line-height:1.1}
.brand p{margin:0;color:var(--muted);font-size:13px}
.mock{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--surface-2);border:1px dashed var(--line);color:var(--muted);vertical-align:middle;margin-left:6px}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px;white-space:nowrap}
button.pill{cursor:pointer}
button.pill:hover{border-color:var(--accent)}
.pill .n{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:12px;font-variant-numeric:tabular-nums}
.pill .n.new{background:var(--c-new)}
.pill.count{background:transparent;color:var(--muted);font-weight:500}
.pill.count b{color:var(--fg);font-variant-numeric:tabular-nums}
.pulse{animation:pulse 1.2s ease 2}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08);border-color:var(--bad)}}

.main{position:relative;min-height:0;display:grid;grid-template-columns:1fr}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden}
#scene{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.zoom{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;display:flex;gap:6px}
.zoom button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.zoom button.wide{width:auto;padding:0 12px;font-size:13px}
.hint{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:6px 10px;border-radius:10px;max-width:260px}

.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);background:var(--surface);font-size:13px}
.flow .lbl{font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:11px;margin-right:4px}
.step{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.step i{width:9px;height:9px;border-radius:50%;display:inline-block}
.arrow{color:var(--muted)}

/* Panneau */
.panel{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-12px 0 30px rgba(0,0,0,.12);transform:translateX(105%);transition:transform .28s ease;display:flex;flex-direction:column;z-index:20;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.panel.open{transform:none}
@media (min-width:1180px){
  .app.has-panel .main{grid-template-columns:1fr 430px}
  .app.has-panel .panel{position:relative;transform:none;box-shadow:none;width:auto;padding-top:0;z-index:1}
  .panel:not(.open){display:none}
  .app.has-panel .panel{grid-column:2;grid-row:1}
}
@media (max-width:640px){
  .panel{top:auto;left:0;width:100%;height:80%;border-left:0;border-top:1px solid var(--line);border-radius:20px 20px 0 0;transform:translateY(105%);padding-left:env(safe-area-inset-left,0px)}
  .panel.open{transform:none}
  .hint{display:none}
  .brand h1{font-size:19px}
  .top .pill.count{display:none}
}
.ph{display:flex;align-items:flex-start;gap:12px;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.ph .av{flex:none;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line)}
.ph .who{flex:1;min-width:0}
.ph h2{font-family:var(--f-display);font-weight:800;font-size:24px;margin:0;line-height:1.1;text-wrap:balance}
.ph .role{margin:3px 0 0;color:var(--muted);font-size:14px}
.ph .close{flex:none;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:18px}
.pb{flex:1;overflow:auto;padding:4px 16px 24px;-webkit-overflow-scrolling:touch}
.sec{padding-top:16px}
.sec h3{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sec p{margin:0;line-height:1.5}
.tagrow{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.chip.off{opacity:.55;font-weight:500;text-decoration:line-through;text-decoration-color:var(--muted)}
.chip i{width:8px;height:8px;border-radius:50%}
.poletag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;color:#fff;margin-top:6px}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.list li{display:flex;gap:8px;align-items:flex-start;line-height:1.4}
ul.list li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:8px}
.task{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.task + .task{margin-top:6px}
.task span{min-width:0}
.st{flex:none;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;border:1px solid currentColor}
.st.en-cours{color:var(--info)} .st.chez-resp{color:var(--c-plan)} .st.chez-dg{color:var(--c-dir)} .st.ton-ok{color:var(--warn)} .st.valide{color:var(--ok)} .st.refuse{color:var(--bad)} .st.attente{color:var(--muted)}
.chain{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:14px}
.chain button{border:0;background:none;padding:0;cursor:pointer;font-weight:700;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line);padding:8px 10px;border-radius:10px;margin-top:8px;line-height:1.45}
.talk{display:flex;flex-direction:column;gap:8px}
.talk textarea{width:100%;min-height:84px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:10px 14px;font-weight:700;border:1px solid var(--line);background:var(--surface-2);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.ok{background:var(--ok);color:#fff;border-color:transparent}
.btn.bad{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.msgs{display:flex;flex-direction:column;gap:6px}
.msg{padding:8px 11px;border-radius:12px;max-width:90%;line-height:1.4;font-size:14px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-fg)}
.msg.them{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line)}
.gauge{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center;font-size:13.5px}
.gauge + .gauge{margin-top:8px}
.bar{height:10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar b{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .5s}
.gauge .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.card{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface-2)}
.card + .card{margin-top:10px}
.card h4{margin:0 0 4px;font-size:15.5px}
.card .meta{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.card blockquote{margin:0 0 10px;padding:8px 10px;border-left:3px solid var(--line);background:var(--surface);border-radius:0 8px 8px 0;font-size:13.5px;line-height:1.45}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.carnet li{font-size:14px}
.carnet li.learned::before{background:var(--gold)}
.ex{font-size:11px;font-weight:700;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:1px 5px;margin-left:4px;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;transition:.25s;z-index:40;max-width:min(520px,calc(100% - 32px));text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.opt{display:flex;flex-direction:column;gap:6px}
.opt .btn{justify-content:flex-start;text-align:left}

/* Scène SVG */
.bx polygon{stroke:rgba(0,0,0,.16);stroke-width:.6;stroke-linejoin:round}
.agent{cursor:pointer}
.agent:focus-visible{outline:none}
.agent:focus-visible .body{stroke:var(--accent);stroke-width:3}
.agent:hover .body{filter:brightness(1.08)}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
.walking .leg1{animation:leg 0.5s ease-in-out infinite alternate}
.walking .leg2{animation:leg 0.5s ease-in-out infinite alternate-reverse}
.leg1,.leg2{transform-box:fill-box;transform-origin:50% 0}
@keyframes leg{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
.lbl{pointer-events:none}
.lbl .name{font:700 11px var(--f-body);fill:var(--fg)}
.lbl .namebg{fill:var(--tag);stroke:var(--line)}
.lbl .btxt{font:600 11px var(--f-body);fill:var(--bubble-fg)}
.lbl .bbg{fill:var(--bubble);stroke:var(--line)}
.zone{cursor:pointer}
.zone text{font:800 12.5px var(--f-display);fill:#fff;letter-spacing:.02em}
.zone:hover rect{filter:brightness(1.08)}
.walltxt{font:800 15px var(--f-display);letter-spacing:.12em;fill:var(--wall-top)}
.glass{pointer-events:none}
.hot{cursor:pointer}
.hot .ring{fill:none;stroke:var(--gold);stroke-width:2.5;stroke-dasharray:6 5;animation:dash 1.6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-22}}
.badge circle{fill:var(--bad)} .badge text{font:800 12px var(--f-body);fill:#fff}
@media (prefers-reduced-motion:reduce){.bob,.walking .leg1,.walking .leg2,.hot .ring,.pulse{animation:none}.panel{transition:none}}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <h1>QG Sainte-Daille <span class="mock">Maquette</span></h1>
      <p>Camping Sainte-Daille · La Nublière · Pôle animation</p>
    </div>
    <span class="pill count" title="Ouverture prévue mi-mars 2027">Prépa saison · <b id="countdown">J-121</b></span>
    <button class="pill" id="btnPres" type="button">Ton bureau</button>
    <button class="pill" id="btnValid" type="button">À valider <span class="n" id="nValid">4</span></button>
    <button class="pill" id="btnRecrut" type="button">Recrutement <span class="n new" id="nRecrut">1</span></button>
  </header>

  <div class="main">
    <div class="stage" id="stage">
      <svg id="scene" role="img" aria-label="Open space isométrique du QG : bureau du président, bureau du directeur général, salle de pause et pôles d'agents"></svg>
      <div class="zoom">
        <button type="button" id="zIn" aria-label="Zoomer">+</button>
        <button type="button" id="zOut" aria-label="Dézoomer">−</button>
        <button type="button" id="zFit" class="wide">Tout voir</button>
      </div>
      <div class="hint">Touche un agent, un panneau de pôle ou ton bureau. Fais glisser pour te déplacer.</div>
    </div>
    <aside class="panel" id="panel" aria-live="polite">
      <div class="ph" id="ph"></div>
      <div class="pb" id="pb"></div>
    </aside>
  </div>

  <footer class="flow" aria-label="Circuit de validation">
    <span class="lbl">Circuit</span>
    <span class="step"><i style="background:var(--info)"></i>Agent fait</span><span class="arrow">→</span>
    <span class="step"><i style="background:var(--c-plan)"></i>Responsable vérifie</span><span class="arrow">→</span>
    <span class="step"><i style="background:var(--c-dir)"></i>DG valide ou renvoie</span><span class="arrow">→</span>
    <span class="step"><i style="background:var(--gold)"></i>Toi : OK président</span>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
/* ---------- Données (exemples de maquette) ---------- */
const ALL_CONN = ['Gmail','Google Calendar','Google Docs','Google Drive','Google Sheets','Google Slides','Canva','DeepL','ElevenLabs','Higgsfield','Spotify','Trello','Unsplash','Speko'];
const POLES = {
  dir:  {name:'Direction', color:'var(--c-dir)'},
  anim: {name:'Animation & Activités', short:'ANIMATION', color:'var(--c-anim)', x0:0.8, y0:7,
         mission:"Inventer et organiser les activités : journée, soirée, club enfants, grands jeux, plan B pluie, matériel.",
         conn:['Google Docs','Google Drive','Spotify','Unsplash'], resp:'lulu', agents:['momo','jojo']},
  plan: {name:'Planning & Équipe', short:'PLANNING & ÉQUIPE', color:'var(--c-plan)', x0:7.8, y0:7,
         mission:"Plannings, horaires, congés, remplacements et réunions de ton équipe d'animateurs.",
         conn:['Google Calendar','Google Sheets','Trello'], resp:'odile', agents:['paco','ines']},
  com:  {name:'Communication', short:'COMMUNICATION', color:'var(--c-com)', x0:14.8, y0:7,
         mission:"Mails, messages, programme affiché, écrans d'accueil et traductions pour les vacanciers étrangers.",
         conn:['Gmail','DeepL','Google Docs','Google Slides'], resp:'margaux', agents:['yanis','lina']},
  cm:   {name:'Community Manager', short:'COMMUNITY MANAGER', color:'var(--c-cm)', x0:0.8, y0:12.6,
         mission:"Les réseaux du camping côté anim : posts, visuels, Reels, TikTok, calendrier de publication.",
         conn:['Canva','Higgsfield','Unsplash','ElevenLabs'], resp:'zoe', agents:['kenzo','maya']},
  suivi:{name:"Suivi d'équipe", short:"SUIVI D'ÉQUIPE", color:'var(--c-suivi)', x0:7.8, y0:12.6,
         mission:"Un référent par animateur : bien-être, objectifs, préparation et compte rendu des entretiens individuels. Rend des comptes directement au DG. Confidentiel.",
         conn:['Google Docs','Google Calendar'], refs:['rose','basile','capucine','elio']},
  free: {name:'Postes libres', short:'POSTES LIBRES', color:'var(--c-free)', x0:14.8, y0:12.6}
};
const SKIN=['#f2c9a5','#e0ac85','#c68a62','#8d5a3b','#f5d6bd','#b97a55'];
const HAIR=['#3b2a20','#1f1a17','#7a4b28','#d9a441','#a33d2b','#5a5a5a'];
const A = {};
function ag(id,o){ A[id]=Object.assign({id,tasks:[],history:[],bubble:'',at:'desk',chat:[]},o); }
ag('gaston',{name:'Gaston',role:'Directeur Général',pole:'dir',level:'dg',skin:0,hair:5,
  bio:"Ton bras droit. Tu me dis ce que tu veux, je le confie au bon pôle, je relis ce que les responsables m'envoient et je te présente seulement ce qui est prêt. Et je note ta façon de bosser pour te déranger de moins en moins.",
  manages:["Répartir tes demandes entre les pôles","Valider ou renvoyer le travail vérifié par les responsables","Te présenter les dossiers prêts pour ton OK","Tenir le carnet de tes préférences","Te proposer des embauches quand tu ajoutes un connecteur"],
  conn:[], connNote:"Aucun outil d'action : il lit les livrables de tous les pôles mais n'envoie rien lui-même.",
  tasks:[{t:"Relire le mail de bienvenue aux saisonniers",s:'chez-dg'},{t:"Préparer une proposition d'embauche pour Speko",s:'en-cours'}],

/* ---------- Géométrie isométrique ---------- */
const S=40, C=0.866*S, H=0.5*S, W=22, D=18, OX=D*C+24, OY=118;
const iso=(x,y,z=0)=>[(x-y)*C+OX,(x+y)*H-z*S+OY];
const VBW=(W+D)*C+48, VBH=(W+D)*H+OY+40;
const P=pts=>pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
const face=(pts,fill,sh)=>`<polygon points="${P(pts)}" style="fill:${fill}"/>`+(sh?`<polygon points="${P(pts)}" fill="#000" fill-opacity="${sh}"/>`:'');
function box(x,y,z,w,d,h,fill,o={}){
  const I=iso;
  const top=[I(x,y,z+h),I(x+w,y,z+h),I(x+w,y+d,z+h),I(x,y+d,z+h)];
  const fr=[I(x,y+d,z),I(x+w,y+d,z),I(x+w,y+d,z+h),I(x,y+d,z+h)];
  const rt=[I(x+w,y,z),I(x+w,y+d,z),I(x+w,y+d,z+h),I(x+w,y,z+h)];
  return `<g class="bx">${face(fr,o.front||fill,.10)}${face(rt,o.right||fill,o.right?0:.22)}${face(top,o.top||fill,0)}</g>`;
}
const floorRect=(x,y,w,d,fill,op=1,extra='')=>`<polygon points="${P([iso(x,y),iso(x+w,y),iso(x+w,y+d),iso(x,y+d)])}" style="fill:${fill}" fill-opacity="${op}" ${extra}/>`;

let OBJ=[]; // {k, svg, id?}
const add=(k,svg,id)=>OBJ.push({k,svg,id});

function desk(x,y,o={}){
  let s=box(x,y,0,1.6,0.8,0.72,o.fill||'var(--desk)');
  s+=box(x+0.12,y+0.12,0.72,0.07,0.52,0.42,'var(--monitor)',{right:'var(--screen)'});
  s+=box(x+0.75,y+0.45,0.72,0.42,0.28,0.02,'#fff');
  s+=box(x+1.3,y+0.2,0.72,0.12,0.12,0.13,o.mug||'var(--c-anim)');
  add(x+0.8+y+0.4, s);
}
function chair(cx,cy,fill='var(--chair)'){
  add(cx+cy-0.05, box(cx-0.25,cy-0.25,0.38,0.5,0.5,0.08,fill)+box(cx-0.25,cy-0.33,0.38,0.5,0.08,0.55,fill));
}
function plant(x,y,sz=1){
  const p=iso(x,y,0.45*sz);
  let s=box(x-0.22*sz,y-0.22*sz,0,0.44*sz,0.44*sz,0.42*sz,'var(--pot)');
  const r=13*sz;
  s+=`<circle cx="${p[0]-6*sz}" cy="${p[1]-10*sz}" r="${r}" style="fill:var(--plant-2)"/><circle cx="${p[0]+7*sz}" cy="${p[1]-14*sz}" r="${r*.9}" style="fill:var(--plant)"/><circle cx="${p[0]}" cy="${p[1]-26*sz}" r="${r*.85}" style="fill:var(--plant)"/>`;
  add(x+y, s);
}
function palm(x,y){
  const b=iso(x,y,0.4), t=iso(x,y,2.2);
  let s=box(x-0.3,y-0.3,0,0.6,0.6,0.4,'var(--pot)');
  s+=`<path d="M${b[0]},${b[1]} Q${b[0]+8},${(b[1]+t[1])/2} ${t[0]},${t[1]}" style="stroke:var(--shelf)" stroke-width="7" fill="none" stroke-linecap="round"/>`;
  [[-42,6],[40,4],[-28,-18],[30,-20],[0,-26]].forEach(([dx,dy])=>{ s+=`<path d="M${t[0]},${t[1]} q${dx*.5},${dy-18} ${dx},${dy+8}" style="stroke:var(--plant)" stroke-width="9" fill="none" stroke-linecap="round"/>`; });
  add(x+y, s);
}

  const glassY=(a,b,y,h=2.2)=>face([iso(a,y,0),iso(b,y,0),iso(b,y,h),iso(a,y,h)],'var(--glass)',0).replace(/style="fill:var\(--glass\)"/,'style="fill:var(--glass)" fill-opacity=".16"')+`<line x1="${iso(a,y,h)[0]}" y1="${iso(a,y,h)[1]}" x2="${iso(b,y,h)[0]}" y2="${iso(b,y,h)[1]}" style="stroke:var(--glass)" stroke-width="3"/><line x1="${iso(a,y,0)[0]}" y1="${iso(a,y,0)[1]}" x2="${iso(a,y,h)[0]}" y2="${iso(a,y,h)[1]}" style="stroke:var(--glass)" stroke-width="2"/>`;
  const glassX=(a,b,x,h=2.2)=>face([iso(x,a,0),iso(x,b,0),iso(x,b,h),iso(x,a,h)],'var(--glass)',0).replace(/style="fill:var\(--glass\)"/,'style="fill:var(--glass)" fill-opacity=".16"')+`<line x1="${iso(x,a,h)[0]}" y1="${iso(x,a,h)[1]}" x2="${iso(x,b,h)[0]}" y2="${iso(x,b,h)[1]}" style="stroke:var(--glass)" stroke-width="3"/><line x1="${iso(x,b,0)[0]}" y1="${iso(x,b,0)[1]}" x2="${iso(x,b,h)[0]}" y2="${iso(x,b,h)[1]}" style="stroke:var(--glass)" stroke-width="2"/>`;

let step=0, waitLeft=4, lastT=0, reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function setBubble(id,b){ A[id].bubble=b; drawLabel(id); }
function placeYanis(x,y,walking,force){
  walk.pos=[x,y]; const p=iso(x,y);
  const inner=yanisNode.firstChild;
  yanisNode.setAttribute('transform',`translate(${p[0].toFixed(1)},${p[1].toFixed(1)})`);
  if(inner && inner.classList){ inner.classList.toggle('walking',walking); const bobg=inner.querySelector('g'); if(bobg) bobg.classList.toggle('bob',!walking); }
  // ordre de profondeur
  const k=x+y; const objs=yanisNode.parentNode; const kids=[...objs.children].filter(n=>n!==yanisNode);
  let before=null; for(const n of kids){ if(parseFloat(n.dataset.k)>k){ before=n; break; } }
  if(force || yanisNode.nextSibling!==before) objs.insertBefore(yanisNode,before);
  drawLabel('yanis');
}
function tick(t){
  const dt=Math.min(0.05,(t-(lastT||t))/1000); lastT=t;
  if(waitLeft>0){ waitLeft-=dt; if(waitLeft<=0){ const cur=ROUTE[step]; cur.onLeave&&cur.onLeave(); step=(step+1)%ROUTE.length; const nx=ROUTE[step]; if(nx.b) setBubble('yanis',nx.b); } }
  else{
    const tgt=ROUTE[step].to; const [x,y]=walk.pos; const dx=tgt[0]-x, dy=tgt[1]-y; const d=Math.hypot(dx,dy); const sp=1.9*dt;
    if(d<=sp){ placeYanis(tgt[0],tgt[1],false); const cur=ROUTE[step]; if(cur.b) setBubble('yanis',cur.b); cur.onArrive&&cur.onArrive(); waitLeft=cur.wait||0.0001; }
    else placeYanis(x+dx/d*sp,y+dy/d*sp,true);
  }
  requestAnimationFrame(tick);
}

function openAgent(id){

  {q:"Avec les vacanciers, on tutoie ou on vouvoie ?",a:["Tutoiement","Vouvoiement","Ça dépend du public"],l:v=>`Vacanciers : ${v.toLowerCase()}`},
  {q:"Le programme de la semaine, tu le veux prêt pour quand ?",a:["Vendredi","Samedi","Dimanche soir"],l:v=>`Programme de la semaine prêt le ${v.toLowerCase()}`},
  {q:"Tes animateurs, tu leur écris surtout par…",a:["Mail","SMS / WhatsApp","Trello"],l:v=>`Canal préféré avec l'équipe : ${v}`}
];
function wireDG(){
  document.getElementById('goValid').onclick=openValid;
  document.getElementById('quiz').onclick=()=>{ let i=0; const box=document.getElementById('quizBox');
    const show=()=>{ if(i>=QUIZ.length){ box.innerHTML=`<div class="note">Merci ! ${esc(A.gaston.name)} a noté tes réponses dans son carnet. Le vrai questionnaire comptera une vingtaine de questions.</div>`; return; }
      const q=QUIZ[i]; box.innerHTML=`<div class="card" style="margin-top:10px"><div class="meta">Question ${i+1} sur ${QUIZ.length} (aperçu)</div><h4>${q.q}</h4><div class="seg" style="margin-top:8px">${q.a.map(x=>`<button type="button" data-a="${esc(x)}">${x}</button>`).join('')}</div></div>`;
      box.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{ CARNET.unshift({t:q.l(b.dataset.a)}); const ul=document.getElementById('carnet'); ul.insertAdjacentHTML('afterbegin',`<li class="learned">${esc(q.l(b.dataset.a))}</li>`); i++; show(); }); };
    show(); };
}
function wireCommon(){ pb.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openAgent(b.dataset.open)); }

function openZone(z){
  if(z==='pres') return openPres();
  if(z==='valid') return openValid();
  if(z==='dg') return openAgent('gaston');
  if(z==='pause') return openPause();
  if(z==='free') return openRecrut();
  openPole(z);
}
function openPole(k){
  const p=POLES[k];
  const members = p.refs ? p.refs : [p.resp,...p.agents];
  const head=`<div class="av" style="background:${p.color}"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="3" y="11" width="24" height="14" rx="3" fill="#fff" opacity=".9"/><rect x="9" y="5" width="12" height="7" rx="2" fill="none" stroke="#fff" stroke-width="2.5"/></svg></div><div class="who"><h2>${esc(p.name)}</h2><p class="role">${p.refs?'4 référents, un par animateur':'1 responsable · 2 agents'}</p></div>`;
  const body=`<div class="sec"><h3>Mission du pôle</h3><p>${esc(p.mission)}</p></div>
  <div class="sec"><h3>L'équipe</h3>${members.map(id=>{const a=A[id];return `<div class="task" role="button" tabindex="0" data-open="${id}" style="cursor:pointer"><span style="display:flex;align-items:center;gap:10px">${avatarSVG(a,34)}<span><b>${esc(a.name)}</b><br><span style="color:var(--muted);font-size:13px">${esc(a.role)}</span></span></span><span class="st ${a.at==='pause'?'attente':'en-cours'}">${a.at==='pause'?'En pause':'Au poste'}</span></div>`}).join('')}</div>
  <div class="sec"><h3>Connecteurs du pôle</h3>${connHTML(p.conn)}<div class="note">Seul ce pôle a accès à ces outils. Les autres pôles ne peuvent pas s'en servir.</div></div>
  <div class="sec"><h3>Demande directe au pôle</h3><div class="talk"><textarea id="poleIn" placeholder="Ta demande ira à ${esc(A[p.resp||p.refs[0]].name)}${p.refs?'':' (responsable)'}, ${esc(A.gaston.name)} sera tenu au courant."></textarea><div class="row"><button class="btn primary" type="button" id="poleSend">Envoyer au pôle</button></div></div></div>`;
  open(head,body); wireCommon();
  document.getElementById('poleSend').onclick=()=>{ const v=document.getElementById('poleIn').value.trim(); if(!v) return; const r=A[p.resp||p.refs[0]]; r.tasks.unshift({t:v.length>60?v.slice(0,57)+'…':v,s:'en-cours'}); DEMANDES.unshift({t:v,s:'en-cours',to:p.name}); setBubble(r.id,'📥 demande du président'); toast(`Envoyé à ${r.name}. ${A.gaston.name} est en copie.`); document.getElementById('poleIn').value=''; };
}
function openPres(){
  const head=`<div class="av" style="background:var(--gold)"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M4 22 L6 9 L11 15 L15 6 L19 15 L24 9 L26 22 Z" fill="#fff"/></svg></div><div class="who"><h2>Ton bureau</h2><p class="role">Président du QG</p></div>`;
  const opts=[['dg',`${A.gaston.name} répartit`],...['anim','plan','com','cm','suivi'].map(k=>[k,POLES[k].name])];
  const body=`<div class="sec"><h3>Nouvelle demande</h3><div class="talk"><textarea id="presIn" placeholder="Ex. : Crée-moi 5 activités pour les 6-10 ans un jour de pluie"></textarea>
  <div><div style="font-size:13px;color:var(--muted);margin-bottom:6px">À qui ?</div><div class="seg" id="presTo">${opts.map((o,i)=>`<button type="button" data-to="${o[0]}" aria-pressed="${i===0}">${esc(o[1])}</button>`).join('')}</div></div>
  <div class="row"><button class="btn primary" type="button" id="presSend">Envoyer la demande</button></div></div>
  <div class="sec" style="padding-top:12px"><h3>Idées de demandes</h3><div class="seg" id="ideas">${["Crée 5 activités pluie pour les 6-10 ans","Fais le planning de la semaine du 12 avril","Prépare un post Insta pour la soirée mousse","Rédige le mail d'accueil des animateurs","Prépare mon entretien avec l'animateur n°1"].map(x=>`<button type="button">${x}</button>`).join('')}</div></div></div>
  <div class="sec"><h3>Tes demandes récentes</h3><div id="dem">${DEMANDES.map(d=>`<div class="task"><span>${esc(d.t)}<br><span style="color:var(--muted);font-size:12.5px">→ ${esc(d.to)}</span></span><span class="st ${d.s}">${ST[d.s]}</span></div>`).join('')}</div></div>
  <div class="sec"><h3>À traiter</h3><div class="row"><button class="btn" type="button" id="pv">${VALID.length} dossiers à valider</button><button class="btn" type="button" id="pr">${RECRUT.done?'Recrutement à jour':'1 proposition d\'embauche'}</button></div></div>`;
  open(head,body);
  let to='dg';
  document.querySelectorAll('#presTo button').forEach(b=>b.onclick=()=>{ to=b.dataset.to; document.querySelectorAll('#presTo button').forEach(x=>x.setAttribute('aria-pressed',x===b)); });
  document.querySelectorAll('#ideas button').forEach(b=>b.onclick=()=>{ document.getElementById('presIn').value=b.textContent; });
  document.getElementById('pv').onclick=openValid; document.getElementById('pr').onclick=openRecrut;
  document.getElementById('presSend').onclick=()=>{
    const v=document.getElementById('presIn').value.trim(); if(!v) return;
    const dest = to==='dg'?'Gaston (répartition)':POLES[to].name;
    DEMANDES.unshift({t:v,s:'en-cours',to:dest});
    if(to==='dg'){ A.gaston.tasks.unshift({t:'Répartir : '+(v.length>50?v.slice(0,47)+'…':v),s:'en-cours'}); setBubble('gaston','📥 demande du président !'); }
    else { const r=A[POLES[to].resp||POLES[to].refs[0]]; r.tasks.unshift({t:v,s:'en-cours'}); setBubble(r.id,'📥 demande du président'); }
    toast(to==='dg'?`${A.gaston.name} a reçu ta demande et va la confier au bon pôle.`:`Envoyé directement au pôle ${POLES[to].name}.`);
    openPres();
  };
}
function openValid(){
  const head=`<div class="av" style="background:var(--warn)"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M5 8h8l2 3h10v13H5z" fill="#fff"/></svg></div><div class="who"><h2>À valider</h2><p class="role">Vérifié par le responsable, validé par ${esc(A.gaston.name)}. Rien ne part sans ton OK.</p></div>`;
  const body=VALID.length? VALID.map(v=>`<div class="card" data-v="${v.id}"><h4>${esc(v.t)}</h4><div class="meta"><span style="color:${POLES[v.pole].color};font-weight:700">${esc(POLES[v.pole].name)}</span> · fait par ${esc(A[v.by].name)} · vérifié par ${esc(A[v.resp].name)} ✓ · validé par ${esc(A.gaston.name)} ✓</div><blockquote>${esc(v.prev)}</blockquote><div class="row"><button class="btn ok" type="button" data-act="ok">OK président</button><button class="btn" type="button" data-act="fix">À corriger</button><button class="btn bad" type="button" data-act="no">Refuser</button></div><div class="why"></div></div>`).join('') + `<div class="note" style="margin-top:14px">Les contenus ci-dessus sont des exemples de maquette.</div>`
  : `<div class="sec"><p>Tout est traité. ${esc(A.gaston.name)} te préviendra au prochain dossier.</p></div>`;
  open(head,`<div class="sec" style="padding-top:12px">${body}</div>`);
  pb.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{
    const card=b.closest('.card'); const v=VALID.find(x=>x.id==card.dataset.v); const act=b.dataset.act;
    if(act==='ok'){ CONF[v.type]=Math.min(100,CONF[v.type]+5); resolve(v,'valide'); toast(`Validé. ${A[v.by].name} peut l'envoyer (dans la vraie version). Confiance ${v.type} : ${CONF[v.type]} %.`); return; }
    const why=card.querySelector('.why');
    why.innerHTML=`<div class="talk" style="margin-top:10px"><textarea placeholder="${act==='fix'?'Qu\'est-ce qu\'il faut changer ?':'Pourquoi tu refuses ?'} ${esc(A.gaston.name)} s'en souviendra."></textarea><div class="row"><button class="btn primary" type="button">Envoyer à ${esc(A.gaston.name)}</button></div></div>`;
    why.querySelector('button').onclick=()=>{ const r=why.querySelector('textarea').value.trim()||'(sans précision)'; CARNET.unshift({t:`${v.type} : ${r}`}); CONF[v.type]=Math.max(0,CONF[v.type]-(act==='no'?10:5)); resolve(v,act==='no'?'refuse':'en-cours'); toast(`${A.gaston.name} a noté ta remarque dans son carnet et renvoie le dossier à ${A[v.resp].name}.`); };
  });
}
function resolve(v,s){ VALID=VALID.filter(x=>x!==v); A[v.by].history.unshift({t:v.t,s}); document.getElementById('nValid').textContent=VALID.length; const bn=document.getElementById('badgeN'); if(bn) bn.textContent=VALID.length; setBubble('gaston',VALID.length?`🗂️ ${VALID.length} dossiers pour toi`:'😎 tout est à jour'); openValid(); }
function openPause(){
  const ids=Object.keys(A).filter(id=>A[id].at==='pause');
  const head=`<div class="av" style="background:var(--c-plan)"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M6 11h15v7a6 6 0 0 1-6 6h-3a6 6 0 0 1-6-6z" fill="#fff"/><path d="M21 13h2a3 3 0 0 1 0 6h-2" fill="none" stroke="#fff" stroke-width="2.4"/></svg></div><div class="who"><h2>Salle de pause</h2><p class="role">Quand quelqu'un n'a rien à faire, il vient ici.</p></div>`;
  const body=`<div class="sec"><h3>En pause en ce moment</h3>${ids.map(id=>{const a=A[id];return `<div class="task" role="button" tabindex="0" data-open="${id}" style="cursor:pointer"><span style="display:flex;align-items:center;gap:10px">${avatarSVG(a,34)}<span><b>${esc(a.name)}</b><br><span style="color:var(--muted);font-size:13px">${esc(a.role)}</span></span></span><span class="st attente">Dispo</span></div>`}).join('')||'<p>Personne : tout le monde bosse !</p>'}</div>
  <div class="note">Dès qu'un agent reçoit une demande, il retourne à son bureau. Si toute l'équipe est ici, c'est que plus rien n'attend.</div>`;
  open(head,body); wireCommon();
}
function openRecrut(){
  const head=`<div class="av" style="background:var(--c-new)"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="13" cy="10" r="5" fill="#fff"/><path d="M4 25a9 9 0 0 1 18 0z" fill="#fff"/><path d="M23 9v8M19 13h8" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg></div><div class="who"><h2>Recrutement</h2><p class="role">Propositions de ${esc(A.gaston.name)} quand tu ajoutes un connecteur</p></div>`;
  const body = RECRUT.done ? `<div class="sec"><p>${esc(RECRUT.done)}</p><div class="note">Ajoute un nouveau connecteur et ${esc(A.gaston.name)} te fera une nouvelle proposition ici.</div></div>` :
  `<div class="sec"><div class="card"><div class="meta">Nouveau connecteur détecté</div><h4>Speko : appels et SMS automatiques</h4><blockquote>« Président, avec Speko on pourrait envoyer des SMS de rappel aux vacanciers inscrits aux activités, et répondre au téléphone pour les infos du programme. Je te propose deux options. » ${esc(A.gaston.name)}</blockquote>
  <div class="opt"><button class="btn" type="button" id="rA"><b>A. Embaucher</b>&nbsp;un nouveau pôle « Accueil & rappels » : Sacha (responsable) + Nina (agent). Ils prennent les 2 postes libres.</button>
  <button class="btn" type="button" id="rB"><b>B. Affecter</b>&nbsp;Speko au pôle Communication : ${esc(A.yanis.name)} envoie les SMS, ${esc(A.margaux.name)} vérifie.</button></div></div>
  <div class="note">${esc(A.gaston.name)} recommande l'option B tant que le volume reste faible (moins de 50 SMS par semaine).</div></div>`;
  open(head,body);
  if(RECRUT.done) return;
  document.getElementById('rA').onclick=()=>{
    POLES.new={name:'Accueil & rappels',short:'ACCUEIL & RAPPELS',color:'var(--c-new)',mission:"SMS de rappel aux vacanciers inscrits et réponses au téléphone sur le programme.",conn:['Speko'],resp:'sacha',agents:['nina']};
    ag('sacha',{name:'Sacha',role:'Responsable Accueil & rappels',pole:'new',level:'resp',skin:2,hair:3,bio:"Fraîchement embauchée ! Je vérifie chaque SMS et chaque réponse téléphonique avant qu'ils partent.",manages:["Vérifier les SMS de rappel","Valider les réponses téléphoniques types"],bubble:'👋 nouvelle !'});
    ag('nina',{name:'Nina',role:'Agent rappels & téléphone',pole:'new',level:'agent',skin:1,hair:0,bio:"J'envoie les SMS de rappel aux vacanciers inscrits et je réponds au téléphone sur le programme.",manages:["SMS de rappel des activités","Réponses téléphoniques sur le programme"],bubble:'👋 premier jour'});
    POLES.free.short='ACCUEIL & RAPPELS'; POLES.free.color='var(--c-new)';
    POLES.free.mission=POLES.new.mission;
    RECRUT.done=`Sacha et Nina ont rejoint le QG (pôle Accueil & rappels). Seul ce pôle a accès à Speko.`;
    document.getElementById('nRecrut').hidden=true; build(); toast('Bienvenue à Sacha et Nina !'); openRecrut();
  };
  document.getElementById('rB').onclick=()=>{
    POLES.com.conn.push('Speko'); A.yanis.manages.push('SMS de rappel avec Speko');
    RECRUT.done=`Speko est affecté au pôle Communication : ${A.yanis.name} s'en sert, ${A.margaux.name} vérifie.`;
    document.getElementById('nRecrut').hidden=true; toast('Speko affecté au pôle Communication.'); openRecrut();
  };
}
// le pôle "free" redirige vers le nouveau pôle une fois embauché
const _openZone=openZone;
openZone=function(z){ if(z==='free' && POLES.new) return openPole('new'); return _openZone(z); };

document.getElementById('btnPres').onclick=openPres;
document.getElementById('btnValid').onclick=openValid;
document.getElementById('btnRecrut').onclick=openRecrut;

let tt; function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),3200); }

// compte à rebours jusqu'à l'ouverture (15 mars 2027)
try{ const d=Math.ceil((new Date(2027,2,15)-new Date())/864e5); if(d>0) document.getElementById('countdown').textContent='J-'+d; else document.getElementById('countdown').textContent='Saison en cours'; }catch(e){}

A.yanis.bubble='✍️ mail de bienvenue';
build();
if(!reduce) requestAnimationFrame(tick);
})();
</script>
