<title>QG La Nublière</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Figtree:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@1,6..72,500&display=swap">
<style>
/* Layout : open space isométrique en pixel art (canvas basse résolution agrandi), étiquettes HTML par-dessus, fiche à droite (feuille du bas sur téléphone). */
:root{
  --bg:#efeaf7; --surface:#ffffff; --surface-2:#f5f2fa; --fg:#231c35; --muted:#625a78; --line:#dcd5ea;
  --accent:#5b3fb8; --accent-fg:#ffffff; --gold:#c98f12; --stage:#c8b4ea;
  --ok:#2a8f55; --warn:#c27c06; --bad:#c2453a; --info:#3a6fd0;
  --c-dir:#3f5291; --c-pres:#c99512; --c-anim:#e5763a; --c-plan:#14968f; --c-com:#4573d6; --c-cm:#d54d8d; --c-suivi:#5f9a45; --c-free:#8a7cab; --c-pause:#8a6bd0; --c-new:#8a5cd0;
  --card:rgba(255,255,255,.94); --card-fg:#231c35;
  --f-label:"Nunito", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-task:"Newsreader", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#15111f; --surface:#1d1829; --surface-2:#251f34; --fg:#ece7f7; --muted:#a79fc0; --line:#352d4a;
  --accent:#a98cf2; --accent-fg:#160f26; --gold:#f0b73a; --stage:#2d2643;
  --ok:#57c784; --warn:#e8a93a; --bad:#ef7468; --info:#78a3f0;
  --c-dir:#8094d6; --c-pres:#e6b43c; --c-anim:#f08b57; --c-plan:#3fb8b1; --c-com:#6f98ec; --c-cm:#e47aa9; --c-suivi:#8ebb70; --c-free:#a99cc8; --c-pause:#a98cf2; --c-new:#b195e8;
  --card:rgba(37,31,52,.95); --card-fg:#ece7f7; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#15111f; --surface:#1d1829; --surface-2:#251f34; --fg:#ece7f7; --muted:#a79fc0; --line:#352d4a;
  --accent:#a98cf2; --accent-fg:#160f26; --gold:#f0b73a; --stage:#2d2643;
  --ok:#57c784; --warn:#e8a93a; --bad:#ef7468; --info:#78a3f0;
  --c-dir:#8094d6; --c-pres:#e6b43c; --c-anim:#f08b57; --c-plan:#3fb8b1; --c-com:#6f98ec; --c-cm:#e47aa9; --c-suivi:#8ebb70; --c-free:#a99cc8; --c-pause:#a98cf2; --c-new:#b195e8;
  --card:rgba(37,31,52,.95); --card-fg:#ece7f7; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;overflow:hidden}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto 1fr auto}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.brand{margin-right:auto;min-width:0}
.brand h1{font-family:var(--f-label);font-weight:900;font-size:22px;margin:0;line-height:1.1}
.brand p{margin:0;color:var(--muted);font-size:13px}
.mock{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px dashed var(--line);color:var(--muted);vertical-align:middle;margin-left:6px}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px;white-space:nowrap;cursor:pointer}
.pill:hover{border-color:var(--accent)}
.pill .n{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:12px;font-variant-numeric:tabular-nums}
.pill .n.new{background:var(--c-new)}
.pill .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.pill .dot.on{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.pulse{animation:pulse 1.2s ease 2}
@keyframes pulse{50%{transform:scale(1.08);border-color:var(--bad)}}

.main{position:relative;min-height:0;display:grid;grid-template-columns:1fr}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--stage);touch-action:none;cursor:grab}
.stage.dragging{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#cv{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.room-lbl{position:absolute;pointer-events:none;display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:14px;border:3px solid rgba(255,255,255,.85);color:#fff;font-family:var(--f-label);cursor:pointer;box-shadow:0 3px 0 rgba(43,33,64,.35);transform:translate(-10%,-50%);white-space:nowrap}
.room-lbl.sm{padding:3px 10px 3px 4px;gap:5px;border-width:2px;border-radius:11px}
.room-lbl.sm .ic{width:20px;height:20px;font-size:12px}
.room-lbl.sm b{font-size:12.5px}
.room-lbl.sm small{display:none}
.room-lbl b{display:block;font-weight:900;font-size:15px;line-height:1.1}
.room-lbl small{display:block;font-weight:700;font-size:11.5px;opacity:.9}
.room-lbl .ic{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.9);display:grid;place-items:center}
.chip{position:absolute;transform:translate(-50%,-100%);pointer-events:none;font:900 9.5px var(--f-label);letter-spacing:.08em;text-transform:uppercase;color:var(--card-fg);background:var(--card);border-radius:7px;padding:2px 6px 2px 5px;white-space:nowrap;box-shadow:0 1px 0 rgba(43,33,64,.25);display:flex;align-items:center;gap:4px}
.chip i{width:6px;height:6px;border-radius:50%}
.card{position:absolute;transform:translate(-50%,-100%);pointer-events:none;background:var(--card);color:var(--card-fg);border-radius:14px;padding:8px 14px 10px;box-shadow:0 6px 18px rgba(43,33,64,.22);min-width:130px;max-width:230px;z-index:2}
.card .nm{font:900 11px var(--f-label);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.card .nm i{width:7px;height:7px;border-radius:50%}
.card .tk{font:italic 500 15.5px/1.25 var(--f-task);margin-top:3px}
.card::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:var(--card)}
.badge{position:absolute;transform:translate(-50%,-50%);min-width:22px;height:22px;border-radius:999px;background:var(--bad);color:#fff;font:900 12px var(--f-label);display:grid;place-items:center;border:2px solid #fff;pointer-events:none}
.nav{position:absolute;top:10px;left:0;right:0;display:flex;gap:6px;overflow-x:auto;padding:2px max(12px,env(safe-area-inset-left,0px)) 6px;z-index:3;scrollbar-width:none;touch-action:pan-x}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:none;display:inline-flex;align-items:center;gap:6px;border:2px solid rgba(255,255,255,.85);border-radius:999px;padding:7px 12px;font:800 13px var(--f-label);color:#fff;cursor:pointer;box-shadow:0 2px 0 rgba(43,33,64,.3)}
.nav button[aria-pressed="true"]{outline:3px solid var(--fg);outline-offset:1px}
.nav button.all{background:var(--surface);color:var(--fg);border-color:var(--line)}
.zoom{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;display:flex;gap:6px;z-index:3}
.zoom button{width:42px;height:42px;border-radius:12px;border:2px solid rgba(43,33,64,.25);background:var(--surface);font-size:20px;font-weight:800;cursor:pointer}
.zoom button.wide{width:auto;padding:0 12px;font-size:13px}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);background:var(--surface);font-size:13px}
.flow .lbl{font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.step{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.step i{width:9px;height:9px;border-radius:50%}
.arrow{color:var(--muted)}

/* Panneau */
.panel{position:fixed;top:var(--hdr,0px);right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-12px 0 30px rgba(0,0,0,.14);transform:translateX(105%);transition:transform .28s ease;display:flex;flex-direction:column;z-index:20;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.panel.open{transform:none}
.panel{min-height:0}
@media (min-width:1180px){
  .app.has-panel .main{grid-template-columns:1fr 440px}
  .app.has-panel .panel{position:relative;transform:none;box-shadow:none;width:auto;padding-top:0;z-index:1;grid-column:2;grid-row:1}
  .panel:not(.open){display:none}
}
@media (max-width:640px){
  .panel{top:auto;left:0;width:100%;height:82%;border-left:0;border-top:1px solid var(--line);border-radius:20px 20px 0 0;transform:translateY(105%);padding-left:env(safe-area-inset-left,0px)}
  .panel.open{transform:none}
  .brand h1{font-size:19px}
  .flow{display:none}
}
.ph{display:flex;align-items:flex-start;gap:12px;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.ph .av{flex:none;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.ph .av canvas{image-rendering:pixelated;width:44px;height:70px;margin-top:8px}
.ph .who{flex:1;min-width:0}
.ph h2{font-family:var(--f-label);font-weight:900;font-size:24px;margin:0;line-height:1.1;text-wrap:balance}
.ph .role{margin:3px 0 0;color:var(--muted);font-size:14px}
.ph .close{flex:none;order:-1;min-width:44px;height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:15px;font-weight:800;display:inline-flex;align-items:center;gap:6px}
.pb{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;padding:4px 16px calc(32px + env(safe-area-inset-bottom,0px))}
.ph{flex:none}
.sec{padding-top:16px}
.sec h3{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.sec p{margin:0;line-height:1.5}
.tagrow{display:flex;flex-wrap:wrap;gap:6px}
.tg{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
.tg.off{opacity:.55;font-weight:500;text-decoration:line-through}
.tg i{width:8px;height:8px;border-radius:50%}
.poletag{display:inline-flex;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;color:#fff;margin-top:6px}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.list li{display:flex;gap:8px;line-height:1.4}
ul.list li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:8px}
.task{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.task + .task{margin-top:6px}
.task span{min-width:0}
.task .sub{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.35}
.st{flex:none;font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap;border:1px solid currentColor}
.st.en-cours{color:var(--info)} .st.chez-resp{color:var(--c-plan)} .st.chez-dg{color:var(--c-dir)} .st.ton-ok{color:var(--warn)} .st.valide{color:var(--ok)} .st.refuse{color:var(--bad)} .st.attente{color:var(--muted)} .st.tempoo{color:var(--accent)} .st.alerte{color:var(--bad)}
.chain button{border:0;background:none;padding:0;cursor:pointer;font-weight:800;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line);padding:8px 10px;border-radius:10px;margin-top:8px;line-height:1.45}
.talk{display:flex;flex-direction:column;gap:8px}
.talk textarea{width:100%;min-height:84px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:10px 14px;font-weight:800;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;text-align:left}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.ok{background:var(--ok);color:#fff;border-color:transparent}
.btn.bad{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.msgs{display:flex;flex-direction:column;gap:6px}
.msg{padding:8px 11px;border-radius:12px;max-width:90%;line-height:1.4;font-size:14px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-fg)}
.msg.them{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line)}
.gauge{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center;font-size:13.5px}
.gauge + .gauge{margin-top:8px}
.bar{height:10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar b{display:block;height:100%;background:var(--accent);border-radius:999px}
.gauge .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.box{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface-2)}
.box + .box{margin-top:10px}
.box h4{margin:0 0 4px;font-size:15.5px}
.box .meta{font-size:12.5px;color:var(--muted);margin-bottom:8px}
.box blockquote{margin:0 0 10px;padding:8px 10px;border-left:3px solid var(--line);background:var(--surface);border-radius:0 8px 8px 0;font-size:13.5px;line-height:1.45}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.ex{font-size:11px;font-weight:800;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:1px 5px;margin-left:4px;white-space:nowrap}
.carnet li.learned::before{background:var(--gold)}
.toast{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;transition:.25s;z-index:40;max-width:min(520px,calc(100% - 32px));text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.opt{display:flex;flex-direction:column;gap:6px}
a.lnk{color:var(--accent);font-weight:700}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}.panel{transition:none}}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <h1>QG La Nublière</h1>
      <p>Camping Sandaya La Nublière · Pôle animation</p>
    </div>
    <button class="pill" id="btnTempoo" type="button"><span class="dot" id="tDot"></span><span id="tTxt">Tempoo…</span></button>
    <button class="pill" id="btnPres" type="button">Ton bureau</button>
    <button class="pill" id="btnValid" type="button">À valider <span class="n" id="nValid">4</span></button>
    <button class="pill" id="btnRecrut" type="button">Recrutement <span class="n new" id="nRecrut">1</span></button>
  </header>

  <div class="main">
    <div class="stage" id="stage">
      <div id="world"><canvas id="cv"></canvas></div>
      <div id="ov"></div>
      <div class="nav" id="nav" aria-label="Aller à un pôle"></div>
      <div class="zoom">
        <button type="button" id="zIn" aria-label="Zoomer">+</button>
        <button type="button" id="zOut" aria-label="Dézoomer">−</button>
        <button type="button" id="zFit" class="wide">Tout voir</button>
      </div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"><div class="ph" id="ph"></div><div class="pb" id="pb"></div></aside>
  </div>

  <footer class="flow" aria-label="Circuit de validation">
    <span class="lbl">Circuit</span>
    <span class="step"><i style="background:var(--accent)"></i>Tempoo</span><span class="arrow">→</span>
    <span class="step"><i style="background:var(--c-dir)"></i>Gaston répartit</span><span class="arrow">→</span>
    <span class="step"><i style="background:var(--info)"></i>Agent fait</span><span class="arrow">→</span>
    <span class="step"><i style="background:var(--c-plan)"></i>Responsable vérifie</span><span class="arrow">→</span>
    <span class="step"><i style="background:var(--c-dir)"></i>Gaston valide</span><span class="arrow">→</span>
    <span class="step"><i style="background:var(--gold)"></i>Toi : OK président</span>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>

(function(){
const ALL_CONN=['Gmail','Google Calendar','Google Docs','Google Drive','Google Sheets','Google Slides','Canva','DeepL','ElevenLabs','Higgsfield','Spotify','Trello','Unsplash','Speko'];
// x0,y0,x1,y1 en cases ; wall/floor = couleurs pixel ; css = couleur d'interface
const ROOMS={
  pres: {name:'Ton bureau',x0:.8,y0:.8,x1:6.9,y1:6.4,wall:'#d9a520',floor:'#f3d68a',css:'var(--c-pres)',ic:'👑'},
  dg:   {name:'Direction',x0:9.2,y0:.8,x1:15.7,y1:6.4,wall:'#4a5c9e',floor:'#cdd3ea',css:'var(--c-dir)',ic:'🧭'},
  pause:{name:'Salle de pause',x0:18,y0:.8,x1:27.6,y1:6.4,wall:'#9b7fd6',floor:'#dccff4',css:'var(--c-pause)',ic:'☕'},
  anim: {name:'Animation & Activités',x0:.8,y0:8.8,x1:8,y1:14,wall:'#ef8a4c',floor:'#f7c09a',css:'var(--c-anim)',ic:'🎪'},
  plan: {name:'Planning & Équipe',x0:10.4,y0:8.8,x1:17.6,y1:14,wall:'#1aa59e',floor:'#9adcd3',css:'var(--c-plan)',ic:'📅'},
  com:  {name:'Communication',x0:20.4,y0:8.8,x1:27.6,y1:14,wall:'#4f7fe0',floor:'#b2c9f3',css:'var(--c-com)',ic:'✉️'},
  cm:   {name:'Community Manager',x0:.8,y0:16.4,x1:8,y1:21.6,wall:'#e05a98',floor:'#f5b9d4',css:'var(--c-cm)',ic:'📸'},
  suivi:{name:"Suivi d'équipe",x0:10.4,y0:16.4,x1:17.6,y1:21.6,wall:'#6aa84f',floor:'#bfe0a6',css:'var(--c-suivi)',ic:'💚'},
  free: {name:'Recrutement',x0:20.4,y0:16.4,x1:27.6,y1:21.6,wall:'#9b8fb5',floor:'#e1d9ee',css:'var(--c-free)',ic:'➕'}
};
const POLES={
  dir:{name:'Direction',css:'var(--c-dir)'},
  anim:{name:'Animation & Activités',css:'var(--c-anim)',mission:"Inventer et organiser les activités : journée, soirée, club enfants, grands jeux, plan B pluie, matériel.",conn:['Google Docs','Google Drive','Spotify','Unsplash'],resp:'lulu',agents:['momo','jojo']},
  plan:{name:'Planning & Équipe',css:'var(--c-plan)',mission:"Plannings, horaires, contrats, recrutement, congés, remplacements et réunions de ton équipe d'animateurs.",conn:['Google Calendar','Google Sheets','Trello'],resp:'odile',agents:['paco','ines']},
  com:{name:'Communication',css:'var(--c-com)',mission:"Mails, messages aux candidats et aux vacanciers, programme affiché, écrans d'accueil et traductions.",conn:['Gmail','DeepL','Google Docs','Google Slides'],resp:'margaux',agents:['yanis','lina']},
  cm:{name:'Community Manager',css:'var(--c-cm)',mission:"Les réseaux côté anim : posts, visuels, Reels, offres d'emploi à relayer, calendrier de publication.",conn:['Canva','Higgsfield','Unsplash','ElevenLabs'],resp:'zoe',agents:['kenzo','maya']},

function errText(e){ const c=e&&e.code; if(c==='not_granted') return "Tu n'as pas autorisé la page à utiliser Claude. Recharge la page et accepte la demande d'autorisation."; if(c==='rate_limited') return "Trop de demandes en même temps : réessaie dans un moment."; return (e&&e.message)||"Claude n'a pas pu terminer ce travail."; }

/* ================= Le circuit réel : Gaston → agent → responsable → Gaston → toi ================= */
async function getSample(){ if(SAMPLE) return SAMPLE; try{ SAMPLE=window.claude&&window.claude.use?await window.claude.use('sample'):null; }catch(e){ SAMPLE=null; } return SAMPLE; }
function persona(id){ const a=A[id], p=POLES[a.pole]||{name:'Direction'}; return `Tu es ${a.name}, ${a.role} au QG des agents IA (pôle « ${p.name} »). ${a.bio} Tu gères : ${a.manages.join(', ')}. Ton style : décontracté camping, tutoiement avec le président, efficace et concret.`; }
function ctxText(k){
  let s=`Contexte : QG des agents IA du pôle animation du camping Sandaya La Nublière. Saison de mi-mars à début octobre 2027. Le président du QG est le responsable animation. Date du jour : ${new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'})}.`;
  if(TEMPOO){ s+=`\nÉquipe (Tempoo) : `+TEMPOO.team.map(m=>`${m.name}, ${m.role}, du ${m.from} au ${m.to}, ${m.h} h`).join(' ; ');
    if(TEMPOO.openPosts&&TEMPOO.openPosts.length) s+=`\nPostes à pourvoir : `+TEMPOO.openPosts.map(o=>`${o.nb} × ${o.role} du ${o.from} au ${o.to}`).join(' ; ');
    const d=k&&TEMPOO.dispatch[k]; if(d) s+=`\nInfos Tempoo pour ce pôle :\n`+d.items.map(i=>`- ${i.t}${i.d?' : '+i.d:''}`).join('\n'); }
  if(S.carnet.length) s+=`\nPréférences du président (carnet de Gaston) :\n`+S.carnet.slice(0,25).map(c=>'- '+c.t).join('\n');
  return s;
}
function createDemande(t,o={}){
  const d={id:'d'+Date.now().toString(36),t,pole:o.pole||null,agent:o.agent||null,resp:null,status:'repartition',type:'Autre',titre:short(t,50),consigne:t,createdAt:Date.now(),log:[]};
  if(d.agent){ d.resp=A[d.agent].level==='agent'?(POLES[d.pole].resp||null):null; }
  log(d,'Demande envoyée par le président'+(o.via?' via '+o.via:'')+'.');
  S.demandes.unshift(d); save(); refresh(); run(d); return d;
}
async function run(d){
  const sample=await getSample();
  if(!sample){ fail(d,"Claude n'est pas joignable ici : ouvre le QG dans l'application Claude ou sur claude.ai."); return; }
  try{
    if(!d.agent){
      setSt(d,'repartition');
      const ks=d.pole?[d.pole]:['anim','plan','com','cm','suivi'].concat(POLES.new?['new']:[]);
      const choices=ks.map(k=>`${k} = ${POLES[k].name} : ${POLES[k].mission} Membres : `+membersOf(k).map(id=>`${id} (${A[id].role})`).join(', ')).join('\n');
      const r=await sample.json(`${persona('gaston')}\n\n${ctxText(d.pole)}\n\nLe président demande : « ${d.t} »\n\nChoisis le pôle et la personne la plus adaptée pour faire ce travail (de préférence un agent ; un référent pour le suivi d'un animateur ; un responsable seulement si personne d'autre ne convient).\nPôles :\n${choices}\n\nRéponds uniquement en JSON : {"pole":"identifiant du pôle","agent":"identifiant de la personne","titre":"titre court du travail, 50 caractères maximum","consigne":"consigne claire pour la personne, 2 à 4 phrases","type":"un parmi : ${TYPES.join(' | ')}"}`,{modelTier:'default',cache:false});
      let pole=r&&POLES[r.pole]&&ks.includes(r.pole)?r.pole:(d.pole||'anim'); let agent=r&&membersOf(pole).includes(r.agent)?r.agent:(membersOf(pole).find(id=>A[id].level!=='resp')||membersOf(pole)[0]);
      Object.assign(d,{pole,agent,titre:short((r&&r.titre)||d.t,50),consigne:(r&&r.consigne)||d.t,type:r&&TYPES.includes(r.type)?r.type:'Autre'});
      d.resp=A[agent].level==='agent'?(POLES[pole].resp||null):null;
      log(d,`${A.gaston.name} confie le travail à ${A[agent].name} (${POLES[pole].name}).`); save();
    }
    await work(d);
  }catch(e){ fail(d,errText(e)); }
}
async function work(d){
  const sample=await getSample(); if(!sample){ fail(d,"Claude n'est pas joignable ici."); return; }
  try{
  for(let attempt=0;attempt<2;attempt++){
    setSt(d,'en-cours');
    const fb=(d.feedback||[]).map(f=>'- '+f).join('\n');
    const {text}=await sample(`${persona(d.agent)}\n\n${ctxText(d.pole)}\n\nDemande du président : « ${d.t} »\nConsigne de ${A.gaston.name} : ${d.consigne||d.t}\n${fb?`\nRemarques à prendre en compte :\n${fb}\n`:''}${fb&&d.content?`\nTa version précédente :\n${d.content}\n`:''}\nOutils de ton pôle : ${(POLES[d.pole].conn||[]).join(', ')||'aucun'}. Ici tu n'as aucun outil : prépare un contenu prêt à copier ou à importer.\nProduis directement le livrable final, en français, complet et concret, adapté au camping. Pas de préambule ni de phrase du type « voici ». Mise en forme simple en texte (titres, listes, tableaux en texte si utile).`,{modelTier:'default',cache:false});
    d.content=String(text||'').trim(); log(d,`${A[d.agent].name} a terminé une version.`); save();
    if(d.resp){
      setSt(d,'chez-resp'); const w=walkToResp(d.agent,d.resp);
      const r=await sample.json(`${persona(d.resp)}\n\n${ctxText(d.pole)}\n\nTu relis le travail de ${A[d.agent].name} avant de l'envoyer à ${A.gaston.name}.\nDemande du président : « ${d.t} »\n\nTravail à relire :\n${d.content}\n\nVérifie la qualité : exactitude, faisabilité au camping, ton, orthographe, complétude. Corrige toi-même ce qui doit l'être.\nRéponds uniquement en JSON : {"ok":true ou false,"remarques":"tes remarques en 1 à 3 phrases","version":"le livrable final complet, corrigé"}`,{modelTier:'default',cache:false});
      if(r&&r.version) d.content=String(r.version).trim(); d.respNote=(r&&r.remarques)||''; log(d,`${A[d.resp].name} : ${d.respNote||'relu et validé.'}`);
      await w.back(); save();
    }
    setSt(d,'chez-dg');
    const g=await sample.json(`${persona('gaston')}\n\n${ctxText(d.pole)}\n\nTu valides le travail avant de le présenter au président. Appuie-toi sur ses préférences (carnet ci-dessus) pour lui éviter du travail inutile.\nDemande du président : « ${d.t} »\n\nTravail :\n${d.content}\n\nRéponds uniquement en JSON : {"verdict":"valider" ou "renvoyer","note":"une phrase pour le président, ou la correction demandée si tu renvoies","type":"un parmi : ${TYPES.join(' | ')}"}`,{modelTier:'default',cache:false});
    d.gNote=(g&&g.note)||''; if(g&&TYPES.includes(g.type)) d.type=g.type;
    if(g&&g.verdict==='renvoyer'&&attempt===0){ d.feedback=(d.feedback||[]).concat([`${A.gaston.name} : ${d.gNote}`]); log(d,`${A.gaston.name} renvoie le travail : ${d.gNote}`); continue; }
    log(d,`${A.gaston.name} valide : ${d.gNote||'prêt pour toi.'}`); setSt(d,'ton-ok'); bump();
    toast(`${A.gaston.name} : « ${short(d.titre||d.t,40)} » attend ton OK.`); return;
  }
  }catch(e){ if(MOV[d.agent]){ delete MOV[d.agent]; render(); } fail(d,errText(e)); }
}

  pb.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openAgent(b.dataset.open)); pb.querySelectorAll('[data-dem]').forEach(b=>b.onclick=()=>openDemande(b.dataset.dem)); setTimeout(fitIfNeeded,320); }

function livePanel(){ if(!curView||!panel.classList.contains('open')) return; const f=document.activeElement; if(f&&(f.tagName==='TEXTAREA'||f.tagName==='INPUT')&&pb.contains(f)) return; const top=pb.scrollTop; curView(); pb.scrollTop=top; }

const taskHTML=t=>`<div class="task"><span>${esc(t.t)}${t.d?`<span class="sub">${esc(t.d)}</span>`:''}</span>${t.s?`<span class="st ${stCls(t.s)}">${DST[t.s]||t.s}</span>`:''}</div>`;

function avatar(a){ const c=document.createElement('canvas'); c.width=12;c.height=20; const x=c.getContext('2d'); const {rows,pal}=sprite(a,null); rows.forEach((r,ri)=>r.forEach((ch,k)=>{ if(ch==='.')return; x.fillStyle=pal[ch]; x.fillRect(k,ri,1,1); })); return c.toDataURL(); }
const avImg=(a,size=44)=>`<img src="${avatar(a)}" alt="" style="image-rendering:pixelated;width:${size*.6}px;height:${size}px">`;
function connHTML(list){ const on=list.map(c=>`<span class="tg"><i style="background:var(--ok)"></i>${c}</span>`).join(''); const off=ALL_CONN.filter(c=>!list.includes(c)).map(c=>`<span class="tg off">${c}</span>`).join('');
  return `<div class="tagrow">${on||'<span class="tg">Aucun connecteur</span>'}</div><div class="sec" style="padding-top:10px"><h3>Pas accès à</h3><div class="tagrow">${off}</div></div>`; }
function bossOf(a){ if(a.level==='dg') return null; if(a.level==='resp'||a.level==='ref') return 'gaston'; return (POLES[a.pole]||{}).resp||'gaston'; }
function copyText(t,btn){ const done=()=>{ btn.textContent='Copié ✓'; setTimeout(()=>btn.textContent='Copier',1600); };
  try{ navigator.clipboard.writeText(t).then(done,()=>fallback()); }catch(e){ fallback(); }
  function fallback(){ const el=btn.closest('.box')?.querySelector('.doc'); if(el){ const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('Texte sélectionné : copie-le avec ton appareil.'); } } }

function openAgent(id){
  selected=id; placeOverlay();
  const a=A[id], p=POLES[a.pole]||{name:'',css:'var(--c-new)'}; const conn=a.level==='dg'?[]:(p.conn||[]); const boss=bossOf(a);
  const chain=a.level==='dg'?`Rend des comptes à : <b>toi, le président</b>`:boss==='gaston'?`Rend des comptes à : ${who('gaston')} → toi`:`Rend des comptes à : ${who(boss)} → ${who('gaston')} → toi`;
  const lv={dg:'Direction',resp:'Responsable de pôle',agent:'Agent',ref:'Référent·e'}[a.level];
  const head=`<div class="av">${avImg(a)}</div><div class="who"><h2 id="pName">${esc(a.name)}</h2><p class="role">${esc(a.role)}</p><span class="poletag" style="background:${a.level==='dg'?'var(--c-dir)':p.css}">${a.level==='dg'?'Direction générale':esc(p.name)} · ${lv}</span></div>`;

  <div class="sec"><h3>Hiérarchie</h3><div class="chain">${chain}</div></div>
  <div class="sec"><h3>Mes connecteurs</h3>${connHTML(conn)}${a.connNote?`<div class="note">${esc(a.connNote)}</div>`:''}${a.pole==='suivi'?`<div class="note">Confidentiel : ses notes ne sont visibles que par toi et ${esc(A.gaston.name)}.</div>`:''}</div>`;
  if(a.level==='dg') body+=dgExtras();
  if(fromT.length) body+=`<div class="sec"><h3>Transmis par ${esc(A.gaston.name)} depuis Tempoo</h3>${fromT.map(it=>taskHTML({t:it.t,d:it.d,s:it.alert?'alerte':'tempoo'})).join('')}${fromT.some(i=>i.url)?`<div class="note">Lien Canva : <a class="lnk" href="${esc(fromT.find(i=>i.url).url)}" target="_blank" rel="noopener">ouvrir la création</a></div>`:''}</div>`;
  body+=`<div class="sec"><h3>En ce moment</h3>${cur.map(demHTML).join('')||`<p style="color:var(--muted)">${a.at==='pause'?'Rien à faire : en salle de pause.':'Rien en cours.'}</p>`}</div>
  <div class="sec"><h3>Historique</h3>${hist.slice(0,15).map(demHTML).join('')||'<p style="color:var(--muted)">Pas encore d\'historique.</p>'}</div>
  <div class="sec"><h3>Lui parler</h3><div class="talk"><div class="msgs" id="msgs">${chat.map(m=>`<div class="msg ${m.me?'me':'them'}" style="white-space:pre-wrap">${esc(m.t)}</div>`).join('')}</div><textarea id="talkIn" placeholder="Pose une question à ${esc(a.name)}…"></textarea><div class="row"><button class="btn primary" id="talkSend" type="button">Envoyer</button>${a.level!=='dg'?`<button class="btn" id="talkTask" type="button">Lui confier comme travail</button>`:''}<button class="btn" id="rename" type="button">Renommer</button></div></div></div>`;
  open(head,body,()=>openAgent(id));
  const tIn=document.getElementById('talkIn');
  document.getElementById('talkSend').onclick=async()=>{ const v=tIn.value.trim(); if(!v) return; const sample=await getSample(); if(!sample){ toast("Claude n'est pas joignable ici : ouvre le QG dans l'application Claude."); return; }

  document.getElementById('rename').onclick=()=>{ const h=document.getElementById('pName'); h.innerHTML=`<input id="renIn" value="${esc(a.name)}" style="font:900 22px var(--f-label);width:100%;border:1px solid var(--line);border-radius:10px;padding:4px 8px;background:var(--surface-2)" aria-label="Nouveau nom">`;

  if(a.level==='dg') wireDG();

function openDemande(idd){
  const d=S.demandes.find(x=>x.id===idd); if(!d) return;
  const head=`<div class="av" style="background:${d.pole?POLES[d.pole].css:'var(--c-dir)'};font-size:26px">📁</div><div class="who"><h2>${esc(d.titre||short(d.t,50))}</h2><p class="role">${d.agent?`${esc(POLES[d.pole].name)} · fait par ${esc(A[d.agent].name)}${d.resp?` · relu par ${esc(A[d.resp].name)}`:''}`:'Gaston choisit le bon pôle…'}</p><span class="poletag" style="background:var(--accent)">${DST[d.status]}</span></div>`;
  let body=`<div class="sec"><h3>Ta demande</h3><p>${esc(d.t)}</p></div>`;
  if(ACTIVE.includes(d.status)) body+=`<div class="note">Le travail avance tout seul : garde la page ouverte. Tu peux continuer à te balader dans le QG.</div>`;
  if(d.err&&d.status==='erreur') body+=`<div class="note" style="color:var(--bad)">${esc(d.err)}</div>`;
  if(d.content) body+=`<div class="sec"><h3>${d.status==='valide'?'Version validée':'Le travail'}</h3><div class="box"><div class="doc" style="white-space:pre-wrap;line-height:1.5;font-size:14.5px">${esc(d.content)}</div><div class="row" style="margin-top:10px"><button class="btn" type="button" id="cpy">Copier</button></div></div></div>`;
  if(d.respNote||d.gNote) body+=`<div class="sec"><h3>Avis</h3>${d.respNote&&d.resp?taskHTML({t:`${A[d.resp].name} : ${d.respNote}`}):''}${d.gNote?taskHTML({t:`${A.gaston.name} : ${d.gNote}`}):''}</div>`;
  if(d.status==='ton-ok') body+=`<div class="sec"><h3>Ta décision</h3><div class="row"><button class="btn ok" type="button" data-act="ok">OK président</button><button class="btn" type="button" data-act="fix">À corriger</button><button class="btn bad" type="button" data-act="no">Refuser</button></div><div id="why"></div><div class="note">Pour l'instant, une fois validé, tu copies le contenu et tu l'utilises où tu veux. L'envoi direct par les connecteurs (Gmail, Canva…) viendra dans une prochaine étape, toujours avec ton OK.</div></div>`;
  if(d.status==='erreur'||d.status==='interrompu') body+=`<div class="sec"><div class="row"><button class="btn primary" type="button" id="retry">Relancer le travail</button><button class="btn bad" type="button" id="drop">Abandonner</button></div></div>`;
  body+=`<div class="sec"><h3>Suivi</h3>${(d.log||[]).map(l=>`<div class="task"><span>${esc(l.t)}<span class="sub">${new Date(l.at).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span></span></div>`).join('')}</div>`;
  open(head,body,()=>openDemande(idd));
  const cp=document.getElementById('cpy'); if(cp) cp.onclick=()=>copyText(d.content,cp);
  const rt=document.getElementById('retry'); if(rt) rt.onclick=()=>{ d.err=''; log(d,'Relancé par le président.'); d.agent?work(d):run(d); };
  const dr=document.getElementById('drop'); if(dr) dr.onclick=()=>{ setSt(d,'refuse'); log(d,'Abandonné par le président.'); save(); openDemande(idd); };
  pb.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>decide(d,b.dataset.act));
}
function decide(d,act){
  if(act==='ok'){ S.conf[d.type]=Math.min(100,(S.conf[d.type]||0)+5); log(d,'Validé par le président.'); setSt(d,'valide'); toast(`Validé. Confiance « ${d.type} » : ${S.conf[d.type]} %.`); openDemande(d.id); return; }
  const why=document.getElementById('why'); why.innerHTML=`<div class="talk" style="margin-top:10px"><textarea id="whyIn" placeholder="${act==='fix'?'Qu\'est-ce qu\'il faut changer ?':'Pourquoi tu refuses ?'} ${esc(A.gaston.name)} s'en souviendra."></textarea><div class="row"><button class="btn primary" type="button" id="whyGo">Envoyer à ${esc(A.gaston.name)}</button></div></div>`;
  document.getElementById('whyGo').onclick=()=>{ const r=document.getElementById('whyIn').value.trim(); if(!r){ toast('Dis en quelques mots ce qui ne va pas : Gaston en a besoin pour apprendre.'); return; }
    S.carnet.unshift({t:`${d.type} : ${r}`,at:Date.now()}); S.conf[d.type]=Math.max(0,(S.conf[d.type]||0)-(act==='no'?10:5));
    if(act==='no'){ log(d,'Refusé par le président : '+r); setSt(d,'refuse'); toast(`${A.gaston.name} a noté pourquoi dans son carnet.`); openDemande(d.id); }
    else { d.feedback=(d.feedback||[]).concat(['Président : '+r]); log(d,'À corriger : '+r); save(); toast(`${A.gaston.name} renvoie le travail à ${A[d.agent].name} avec ta remarque.`); work(d); openDemande(d.id); } };
}
function openZone(z){ if(z==='pres')return openPres(); if(z==='valid')return openValid(); if(z==='dg')return openAgent('gaston'); if(z==='pause')return openPause(); if(z==='free')return POLES.new?openPole('new'):openRecrut(); openPole(z); }
function openPole(k){
  const p=POLES[k], r=ROOMS[roomOf(k)]; const members=membersOf(k); const d=TEMPOO&&TEMPOO.dispatch[k];
  const dem=S.demandes.filter(x=>x.pole===k).slice(0,10);
  const head=`<div class="av" style="background:${p.css};font-size:28px">${r.ic}</div><div class="who"><h2>${esc(p.name)}</h2><p class="role">${p.refs?'4 référents, un par animateur':'1 responsable · 2 agents'}</p></div>`;
  const body=`<div class="sec"><h3>Mission du pôle</h3><p>${esc(p.mission)}</p></div>
  ${d?`<div class="sec"><h3>Reçu de Tempoo via ${esc(A.gaston.name)} → ${esc(A[d.to].name)}</h3>${d.items.map(it=>taskHTML({t:it.t,d:it.d,s:it.alert?'alerte':'tempoo'})).join('')}</div>`:''}
  <div class="sec"><h3>L'équipe</h3>${members.map(id=>{const a=A[id];return `<div class="task" role="button" tabindex="0" data-open="${id}" style="cursor:pointer"><span style="display:flex;align-items:center;gap:10px">${avImg(a,30)}<span><b>${esc(a.name)}</b><span class="sub">${esc(a.role)}</span></span></span><span class="st ${a.at==='pause'?'attente':'en-cours'}">${a.at==='pause'?'En pause':'Au poste'}</span></div>`}).join('')}</div>
  <div class="sec"><h3>Travaux du pôle</h3>${dem.map(demHTML).join('')||'<p style="color:var(--muted)">Aucun pour l\'instant.</p>'}</div>
  <div class="sec"><h3>Connecteurs du pôle</h3>${connHTML(p.conn)}<div class="note">Seul ce pôle a accès à ces outils.</div></div>
  <div class="sec"><h3>Demande directe au pôle</h3><div class="talk"><textarea id="poleIn" placeholder="Ta demande ira directement à ce pôle. ${esc(A.gaston.name)} validera avant de te la présenter."></textarea><div class="row"><button class="btn primary" type="button" id="poleSend">Envoyer au pôle</button></div></div></div>`;
  open(head,body,()=>openPole(k));
  document.getElementById('poleSend').onclick=()=>{ const v=document.getElementById('poleIn').value.trim(); if(!v) return; const dd=createDemande(v,{pole:k,via:'le pôle '+p.name}); toast(`Envoyé au pôle ${p.name}.`); openDemande(dd.id); };
}
function tempooLine(){ if(TSTATE==='ok') return `<div class="task"><span>Synchronisé le ${frDate(TEMPOO.syncedAt)}<span class="sub">Mise à jour chaque matin. Lecture seule : Tempoo n'est jamais modifié.</span></span><span class="st valide">Connecté</span></div>`;
  if(TSTATE==='loading') return `<p>Connexion à Tempoo…</p>`; return `<div class="task"><span>Données Tempoo indisponibles ici<span class="sub">Ouvre le QG dans ton compte Claude pour voir tes données.</span></span><span class="st attente">Hors ligne</span></div>`; }
function frDate(s){ try{ const [y,m,d]=String(s).slice(0,10).split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});}catch(e){return s;} }
function openTempoo(){
  const head=`<div class="av" style="background:var(--accent);color:#fff;font:900 22px var(--f-label)">T</div><div class="who"><h2>Tempoo → QG</h2><p class="role">${esc(A.gaston.name)} lit Tempoo et répartit chaque info au bon pôle</p></div>`;
  let body=`<div class="sec">${tempooLine()}</div>`;
  if(TEMPOO){
    body+=`<div class="sec"><h3>Ton équipe dans Tempoo</h3>${TEMPOO.team.map(m=>`<div class="task"><span>${esc(m.name)} · ${esc(m.role)}<span class="sub">Du ${frDate(m.from)} au ${frDate(m.to)} · ${m.h} h</span></span><span class="st valide">Sous contrat</span></div>`).join('')}${(TEMPOO.openPosts||[]).map(o=>`<div class="task"><span>${o.nb} × ${esc(o.role)}<span class="sub">Du ${frDate(o.from)} au ${frDate(o.to)} · ${o.h} h</span></span><span class="st refuse">À recruter</span></div>`).join('')}</div>`;
    for(const k in TEMPOO.dispatch){ const d=TEMPOO.dispatch[k], p=POLES[k]; if(!p) continue; body+=`<div class="sec"><h3 style="color:${p.css}">${esc(p.name)} · confié à ${esc(A[d.to].name)}</h3>${d.items.map(it=>taskHTML({t:it.t,d:it.d,s:it.alert?'alerte':'tempoo'})).join('')}</div>`; }
    body+=`<div class="sec"><h3>Gardé par ${esc(A.gaston.name)}</h3>${(TEMPOO.alerts||[]).map(t=>taskHTML({t,s:'alerte'})).join('')}</div>`;
  }
  body+=`<div class="note">Le QG ne fait que lire Tempoo. Rien n'est jamais écrit dans Tempoo depuis le QG.</div>`;
  open(head,body,openTempoo);
}
function openPres(){
  const head=`<div class="av" style="background:var(--c-pres);font-size:28px">👑</div><div class="who"><h2>Ton bureau</h2><p class="role">Président du QG</p></div>`;
  const opts=[['dg',`${A.gaston.name} répartit`],...['anim','plan','com','cm','suivi'].concat(POLES.new?['new']:[]).map(k=>[k,POLES[k].name])];
  const act=S.demandes.filter(d=>ACTIVE.includes(d.status)), ok=toValidate(), rest=S.demandes.filter(d=>!ACTIVE.includes(d.status)&&d.status!=='ton-ok');
  const body=`<div class="sec"><h3>Nouvelle demande</h3><div class="talk"><textarea id="presIn" placeholder="Ex. : Remplis le planning type du Second d'animation"></textarea>
  <div><div style="font-size:13px;color:var(--muted);margin-bottom:6px">À qui ?</div><div class="seg" id="presTo">${opts.map((o,i)=>`<button type="button" data-to="${o[0]}" aria-pressed="${i===0}">${esc(o[1])}</button>`).join('')}</div></div>
  <div class="row"><button class="btn primary" type="button" id="presSend">Envoyer la demande</button></div></div>
  <div class="sec" style="padding-top:12px"><h3>Idées de demandes</h3><div class="seg" id="ideas">${["Remplis le planning type du Second d'animation (35 h)","Rédige l'offre d'emploi Animateur/trice Miniclub pour Insta","Rédige la convocation en visio pour les candidats","Programme les 9 incontournables sur une semaine type de juillet","Prépare la trame de l'entretien d'arrivée de Tristan","Liste le matériel à commander pour les ateliers Kids"].map(x=>`<button type="button">${esc(x)}</button>`).join('')}</div></div></div>
  ${ok.length?`<div class="sec"><h3>Attend ton OK (${ok.length})</h3>${ok.map(demHTML).join('')}</div>`:''}
  <div class="sec"><h3>En cours (${act.length})</h3>${act.map(demHTML).join('')||'<p style="color:var(--muted)">Rien en cours : tout le monde est en pause.</p>'}</div>
  <div class="sec"><h3>Terminé</h3>${rest.slice(0,20).map(demHTML).join('')||'<p style="color:var(--muted)">Rien pour l\'instant.</p>'}</div>
  <div class="sec"><h3>À savoir</h3><div class="note">Chaque demande fait travailler Claude sur ton compte, et ça avance tant que la page reste ouverte. Tout est enregistré ${SAVE==='cloud'?'dans ton espace privé Claude : tu retrouves tout sur tablette, téléphone ou ordinateur.':'sur cet appareil seulement (pas de connexion à ton espace Claude ici).'}</div></div>`;
  open(head,body,openPres); let to='dg';
  document.querySelectorAll('#presTo button').forEach(b=>b.onclick=()=>{ to=b.dataset.to; document.querySelectorAll('#presTo button').forEach(x=>x.setAttribute('aria-pressed',x===b)); });
  document.querySelectorAll('#ideas button').forEach(b=>b.onclick=()=>{ document.getElementById('presIn').value=b.textContent; });
  document.getElementById('presSend').onclick=()=>{ const v=document.getElementById('presIn').value.trim(); if(!v){ toast('Écris d\'abord ta demande.'); return; }
    const d=createDemande(v,to==='dg'?{via:'Gaston'}:{pole:to,via:'le pôle '+POLES[to].name}); toast(to==='dg'?`${A.gaston.name} a reçu ta demande.`:`Envoyé au pôle ${POLES[to].name}.`); openDemande(d.id); };
}
function openValid(){
  const ok=toValidate();
  const head=`<div class="av" style="background:var(--warn);font-size:26px">📁</div><div class="who"><h2>À valider</h2><p class="role">Vérifié par le responsable, validé par ${esc(A.gaston.name)}. Rien ne part sans ton OK.</p></div>`;
  open(head,`<div class="sec">${ok.map(demHTML).join('')||`<p>Rien à valider pour l'instant. Fais une demande depuis <b>Ton bureau</b>.</p>`}</div>`,openValid);
}
function openPause(){ const ids=Object.keys(A).filter(id=>A[id].at==='pause');
  open(`<div class="av" style="background:var(--c-pause);font-size:28px">☕</div><div class="who"><h2>Salle de pause</h2><p class="role">Quand quelqu'un n'a rien à faire, il vient ici.</p></div>`,
  `<div class="sec"><h3>En pause (${ids.length})</h3>${ids.map(id=>{const a=A[id];return `<div class="task" role="button" tabindex="0" data-open="${id}" style="cursor:pointer"><span style="display:flex;align-items:center;gap:10px">${avImg(a,30)}<span><b>${esc(a.name)}</b><span class="sub">${esc(a.role)}</span></span></span><span class="st attente">Dispo</span></div>`}).join('')||'<p>Personne : tout le monde bosse !</p>'}</div><div class="note">Dès qu'un agent reçoit un travail, il retourne à son bureau.</div>`,openPause); }
function openRecrut(){
  const head=`<div class="av" style="background:var(--c-new);font-size:26px">➕</div><div class="who"><h2>Recrutement</h2><p class="role">Propositions de ${esc(A.gaston.name)} quand tu ajoutes un connecteur</p></div>`;
  const done=S.recrut==='A'?'Sacha et Nina ont rejoint le QG (pôle Accueil & rappels). Seul ce pôle a accès à Speko.':S.recrut==='B'?`Speko est affecté au pôle Communication : ${A.yanis.name} s'en sert, ${A.margaux.name} vérifie.`:'';
  const body=done?`<div class="sec"><p>${esc(done)}</p></div>`:`<div class="sec"><div class="box"><div class="meta">Connecteur non affecté</div><h4>Speko : appels et SMS automatiques</h4><blockquote>« Président, avec Speko on pourrait envoyer des SMS de rappel aux vacanciers inscrits aux activités, et répondre au téléphone sur le programme. Je te propose deux options. » ${esc(A.gaston.name)}</blockquote>
  <div class="opt"><button class="btn" type="button" id="rA"><b>A. Embaucher</b>&nbsp;un nouveau pôle « Accueil & rappels » : Sacha (responsable) + Nina (agent), dans les 2 postes libres.</button><button class="btn" type="button" id="rB"><b>B. Affecter</b>&nbsp;Speko au pôle Communication : ${esc(A.yanis.name)} prépare les SMS, ${esc(A.margaux.name)} vérifie.</button></div></div>
  <div class="note">${esc(A.gaston.name)} recommande l'option B tant que le volume reste faible.</div></div>`;
  open(head,body,openRecrut); if(done) return;
  document.getElementById('rA').onclick=()=>{ S.recrut='A'; hireNew(); save(); document.getElementById('nRecrut').hidden=true; lastAtSig=''; buildNav(); refresh(); toast('Bienvenue à Sacha et Nina !'); openRecrut(); };
  document.getElementById('rB').onclick=()=>{ S.recrut='B'; if(!POLES.com.conn.includes('Speko')) POLES.com.conn.push('Speko'); save(); document.getElementById('nRecrut').hidden=true; toast('Speko affecté au pôle Communication.'); openRecrut(); };
}
document.getElementById('btnPres').onclick=openPres; document.getElementById('btnValid').onclick=openValid; document.getElementById('btnRecrut').onclick=openRecrut; document.getElementById('btnTempoo').onclick=openTempoo;
let tt; function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),3600); }

/* ================= Tempoo et chargement ================= */
function setTempoo(data,state){
  TEMPOO=data; TSTATE=state;
  document.getElementById('tDot').classList.toggle('on',state==='ok');
  document.getElementById('tTxt').textContent=state==='ok'?`Tempoo · ${frDate(data.syncedAt).replace(/ \d{4}$/,'')}`:state==='loading'?'Tempoo…':'Tempoo hors ligne';
  if(data){ (data.referents||[]).forEach(r=>{ if(refInfo[r.ref]) refInfo[r.ref]={who:r.who,role:r.role}; }); refreshRefs(); }
}
async function boot(){
  try{ const ls=localStorage.getItem('qg-state'); if(ls) S=Object.assign(S,JSON.parse(ls)); }catch(e){}
  try{ const c=window.claude; if(c&&c.use){ const [db,user]=await Promise.all([c.use('db'),c.use('user')]);
    if(db&&user){ const uid=await user.id(); if(uid){ DB=db; UID=uid;
      const [q,t]=await Promise.all([db.collection('data/users/'+uid).doc('qg').get(),db.collection('data/users/'+uid).doc('tempoo').get()]);
      if(q.exists) S=Object.assign({v:1,demandes:[],carnet:[],conf:{},chats:{},names:{},recrut:null},JSON.parse(JSON.stringify(q.data())));
      SAVE='cloud'; if(t.exists) setTempoo(JSON.parse(JSON.stringify(t.data())),'ok'); } } } }catch(e){}
  if(TSTATE==='loading') setTempoo(null,'off');
  for(const k in S.names) if(A[k]) A[k].name=S.names[k];
  if(S.recrut==='A'){ hireNew(); buildNav(); } if(S.recrut==='B'&&!POLES.com.conn.includes('Speko')) POLES.com.conn.push('Speko');
  document.getElementById('nRecrut').hidden=!!S.recrut;
  let stuck=false; S.demandes.forEach(d=>{ if(ACTIVE.includes(d.status)){ d.status='interrompu'; log(d,'Interrompu : la page a été fermée pendant le travail.'); stuck=true; } }); if(stuck) save();
  lastAtSig=''; refresh();
}

/* ================= Démarrage ================= */
setHdr(); buildBG(); buildObjs(); render(); fit(); buildNav(); lastW=stage.clientWidth; setTempoo(null,'loading'); refresh();
requestAnimationFrame(tick);
setTimeout(boot,0);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(placeOverlay);
})();
</script>
